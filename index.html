<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f5ea">
<link rel="manifest" href="manifest.webmanifest">
<title>PlanningRepas</title>
<style>
:root {
  --green:#2f7d4a; --green2:#4fa56c; --cream:#fffaf1; --orange:#f2a65a;
  --blue:#78aee8; --red:#d95d5d; --ink:#173042; --card:#ffffffee;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#f8f3e8,#edf7ef);color:var(--ink)}
button,input,select{font:inherit}
.screen{display:none;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(18px + env(safe-area-inset-bottom))}
.screen.active{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.topbar button{border:0;background:#fff;padding:9px 13px;border-radius:18px;box-shadow:0 2px 8px #0001;font-weight:700}
.home-hero{position:relative;overflow:hidden;border-radius:28px;padding:22px;background:linear-gradient(135deg,#fff9e9,#eaf7ec);min-height:60vh;box-shadow:0 10px 24px #0002}
.emu{font-size:92px;line-height:1;margin:12px 0}
.title{font-size:34px;font-weight:900;margin:0}
.subtitle{font-size:18px;margin-top:4px}
.quote{margin:14px 0 22px;font-style:italic}
.home-actions{display:grid;gap:14px;margin-top:20px}
.bigbtn{border:0;border-radius:22px;padding:20px;text-align:left;font-weight:800;font-size:23px;color:#113;box-shadow:0 8px 20px #0002}
.bigbtn small{display:block;font-size:14px;font-weight:500;margin-top:4px}
.menus{background:linear-gradient(135deg,#dff3dc,#b9e3bf)}
.courses{background:linear-gradient(135deg,#ffe0a8,#ffc879)}
.navdate{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:10px}
.navdate button{border:0;background:white;border-radius:16px;padding:12px;font-size:20px}
.datebox{background:white;border-radius:16px;padding:10px;text-align:center;font-weight:800}
.quick{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.quick button{border:0;border-radius:14px;padding:10px 12px;background:#fff}
.cards{display:grid;gap:12px}
.daycard{background:var(--card);border-radius:22px;padding:15px;box-shadow:0 6px 18px #0001}
.daycard h3{margin:0 0 10px}
.slot{border-radius:18px;padding:14px;margin-top:10px}
.midday{background:#fff3c7}
.evening{background:#dfeeff}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:center;background:white;border-radius:14px;padding:10px;margin:8px 0}
.meal .name{font-weight:800}
.mealmenu{display:flex;gap:6px;flex-wrap:wrap}
.mealmenu button{border:0;border-radius:12px;padding:7px 9px;font-size:13px}
.move{background:#d9f2de} .delete{background:#ffd9d9} .resto{background:#e8ddff}
.empty{font-style:italic;color:#687}
.add{width:100%;border:1px dashed #999;background:#ffffff99;padding:9px;border-radius:12px}
.searchdate{width:100%;padding:11px;border-radius:12px;border:1px solid #ccd;background:#fff}
.section-title{font-size:28px;font-weight:900;margin:4px 0 12px}
.decor{font-size:28px}
.shoplist{background:white;border-radius:22px;padding:14px;box-shadow:0 6px 18px #0001}
.shopitem{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}
.shopitem:last-child{border-bottom:0}
.shopitem input{transform:scale(1.25)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#173042;color:white;padding:10px 16px;border-radius:20px;display:none;z-index:20}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:end;z-index:30}
.modal.open{display:flex}
.sheet{background:white;width:100%;border-radius:24px 24px 0 0;padding:18px;max-height:85vh;overflow:auto}
.sheet h3{margin-top:0}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet button{border:0;border-radius:12px;padding:11px 14px}
.primary{background:var(--green);color:white}
.secondary{background:#eee}
footer{text-align:center;font-size:12px;color:#678;margin:18px}
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="home-hero">
    <div class="decor">🍴 🥄 🍲</div>
    <h1 class="title">PlanningRepas</h1>
    <div class="subtitle">Des idées savoureuses pour chaque jour !</div>
    <div class="emu">🪶👨‍🍳</div>
    <div class="quote">« Manger bien, c’est se faire du bien ! »</div>
    <div class="home-actions">
      <button class="bigbtn menus" onclick="showScreen('menus')">🍽️ Menus<small>Planifier, déplacer et gérer les repas</small></button>
      <button class="bigbtn courses" onclick="showScreen('courses')">🛒 Courses<small>Vos listes de courses par semaine</small></button>
    </div>
  </div>
  <footer>Bastiaan (31) TM</footer>
</section>

<section id="menus" class="screen">
  <div class="topbar">
    <button onclick="showScreen('home')">⌂ Accueil</button>
    <span class="decor">🍳🥣</span>
  </div>
  <div class="section-title">Menus</div>
  <div class="navdate">
    <button onclick="shiftDate(-1)">◀</button>
    <div class="datebox" id="rangeLabel"></div>
    <button onclick="shiftDate(1)">▶</button>
  </div>
  <div class="quick">
    <button onclick="goToday()">Aujourd’hui</button>
    <button onclick="document.getElementById('datePicker').showPicker?.() || document.getElementById('datePicker').click()">📅 Choisir une date</button>
    <input id="datePicker" type="date" class="searchdate" onchange="pickDate(this.value)">
  </div>
  <div id="days" class="cards"></div>
</section>

<section id="courses" class="screen">
  <div class="topbar">
    <button onclick="showScreen('home')">⌂ Accueil</button>
    <span class="decor">🥕🧺</span>
  </div>
  <div class="section-title">Courses</div>
  <div class="shoplist" id="shoplist"></div>
</section>

<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const menusSeed = {};
const coursesSeed = {};

const KEY='planningrepas-v2';
const CHECKS='planningrepas-checks-v2';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || structuredClone(menusSeed);
let selected = new Date();
let undoStack=[];

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='menus')renderMenus();if(id==='courses')renderCourses();window.scrollTo(0,0)}
function iso(d){return d.toISOString().slice(0,10)}
function fr(d){return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function keyForDate(d){
  const s=iso(d);
  if(state[s]) return s;
  // support legacy display keys containing DD/MM/YYYY or textual dates
  const candidates=Object.keys(state);
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'), yyyy=d.getFullYear();
  return candidates.find(k=>k===`${dd}/${mm}/${yyyy}` || k.includes(`${dd}/${mm}/${yyyy}`)) || s;
}
function normalizeDay(d){
  const k=keyForDate(d);
  if(!state[k]) state[k]={midi:[],soir:[]};
  for(const slot of ['midi','soir']){
    if(typeof state[k][slot]==='string') state[k][slot]=state[k][slot]? [state[k][slot]]:[];
    if(!Array.isArray(state[k][slot])) state[k][slot]=[];
  }
  return [k,state[k]];
}
function renderMenus(){
  const d1=new Date(selected); const d2=new Date(selected); d2.setDate(d2.getDate()+1);
  document.getElementById('rangeLabel').textContent=`${fr(d1)} → ${fr(d2)}`;
  document.getElementById('datePicker').value=iso(d1);
  const box=document.getElementById('days'); box.innerHTML='';
  [d1,d2].forEach(d=>box.appendChild(dayCard(d)));
}
function dayCard(d){
  const [k,day]=normalizeDay(d);
  const c=document.createElement('div'); c.className='daycard';
  c.innerHTML=`<h3>${fr(d)}</h3>` + slotHtml(k,'midi','☀️ Midi','midday',day.midi) + slotHtml(k,'soir','🌙 Soir','evening',day.soir);
  return c;
}
function slotHtml(k,slot,label,cls,arr){
  const meals=arr.length ? arr.map((m,i)=>`
  <div class="meal">
    <div><div class="name">${escapeHtml(m)}</div></div>
    <div class="mealmenu">
      <button class="move" onclick="openMove('${k}','${slot}',${i})">Déplacer</button>
      <button class="delete" onclick="removeMeal('${k}','${slot}',${i})">Supprimer</button>
    </div>
  </div>`).join('') : `<div class="empty">Pas de repas prévu</div>`;
  return `<div class="slot ${cls}"><b>${label}</b>${meals}
  <button class="add" onclick="addMeal('${k}','${slot}')">＋ Ajouter un repas</button>
  <button class="add" onclick="markRestaurant('${k}','${slot}')">🍽️ Restaurant</button>
  </div>`;
}
function snapshot(){undoStack.push(JSON.stringify(state));if(undoStack.length>20)undoStack.shift()}
function undo(){if(!undoStack.length)return toast('Rien à annuler');state=JSON.parse(undoStack.pop());save();renderMenus();toast('Dernière modification annulée')}
function addMeal(k,slot){
  const name=prompt('Nom du repas :'); if(!name)return; snapshot(); normalizeByKey(k); state[k][slot].push(name.trim()); save(); renderMenus();
}
function normalizeByKey(k){if(!state[k])state[k]={midi:[],soir:[]};['midi','soir'].forEach(s=>{if(typeof state[k][s]==='string')state[k][s]=state[k][s]?[state[k][s]]:[];if(!Array.isArray(state[k][s]))state[k][s]=[]})}
function removeMeal(k,slot,i){
  if(!confirm('Supprimer ce repas ?'))return; snapshot(); normalizeByKey(k); state[k][slot].splice(i,1); save();renderMenus();
}
function markRestaurant(k,slot){snapshot();normalizeByKey(k);state[k][slot].push('🍽️ Restaurant');save();renderMenus()}
function openMove(k,slot,i){
  normalizeByKey(k); const meal=state[k][slot][i]; const sheet=document.getElementById('sheet');
  sheet.innerHTML=`<h3>Déplacer un repas</h3><p><b>${escapeHtml(meal)}</b></p>
    <label>Nouvelle date</label><input id="moveDate" type="date" class="searchdate" value="${iso(selected)}">
    <p>Créneau</p><div class="row"><button id="midiBtn" class="secondary" onclick="setMoveSlot('midi')">Midi</button><button id="soirBtn" class="secondary" onclick="setMoveSlot('soir')">Soir</button></div>
    <p style="font-size:13px;color:#567">Le repas est ajouté à la destination. S’il y a déjà un repas, les deux seront conservés. L’ancien emplacement devient « Pas de repas prévu » s’il ne reste rien.</p>
    <div class="row"><button class="secondary" onclick="closeModal()">Annuler</button><button class="primary" onclick="doMove('${k}','${slot}',${i})">Déplacer</button><button class="secondary" onclick="undo();closeModal()">Annuler la dernière modification</button></div>`;
  window.moveSlot='midi'; document.getElementById('modal').classList.add('open');
}
function setMoveSlot(s){window.moveSlot=s}
function doMove(k,slot,i){
  const date=document.getElementById('moveDate').value;if(!date)return;
  snapshot();normalizeByKey(k);const meal=state[k][slot][i];state[k][slot].splice(i,1);
  const dk=keyForDate(new Date(date+'T12:00:00'));normalizeByKey(dk);state[dk][window.moveSlot||'midi'].push(meal);
  save();closeModal();renderMenus();toast('Repas déplacé');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function shiftDate(n){selected.setDate(selected.getDate()+n);renderMenus()}
function goToday(){selected=new Date();renderMenus()}
function pickDate(v){if(!v)return;selected=new Date(v+'T12:00:00');renderMenus()}
function renderCourses(){
  const box=document.getElementById('shoplist'); box.innerHTML='';
  const checks=JSON.parse(localStorage.getItem(CHECKS)||'{}');
  let items=[];
  if(Array.isArray(coursesSeed)) items=coursesSeed;
  else if(coursesSeed && typeof coursesSeed==='object') items=Object.values(coursesSeed).flatMap(v=>Array.isArray(v)?v:[v]);
  if(!items.length) items=['Pain','Lait','Œufs','Fruits','Légumes'];
  [...new Set(items)].forEach((item,idx)=>{
    const row=document.createElement('label');row.className='shopitem';
    const ck=document.createElement('input');ck.type='checkbox';ck.checked=!!checks[item];
    ck.onchange=()=>{checks[item]=ck.checked;localStorage.setItem(CHECKS,JSON.stringify(checks))};
    const sp=document.createElement('span');sp.textContent=item;
    row.append(ck,sp);box.appendChild(row);
  });
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
