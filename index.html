function fmt(d){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d).replace(/^./,c=>c.toUpperCase());}
function mealCard(when,name,ing,people){return `<section class="card ${when==='Midi'?'midi':'soir'}"><div class="meal">${when} — ${name}</div><div class="ingredients">${ing}</div><div class="people">👥 ${people} ${people===1?'personne':'personnes'}</div></section>`}
function addDay(d,label){let row=menus.find(x=>x[0]===isoLocal(d));let s=`<div class="day">${label} — ${fmt(d)}</div>`;if(!row)return s+'<p>Aucun repas programmé dans le planning pour cette date.</p>';return s+mealCard('Midi',row[1],row[2],row[3])+mealCard('Soir',row[4],row[5],row[6]);}
function showMeals(){let t=new Date();t.setHours(12,0,0,0);let tomorrow=new Date(t);tomorrow.setDate(t.getDate()+1);content.innerHTML=addDay(t,"Aujourd’hui")+addDay(tomorrow,"Demain");}
function showWeeks(){content.innerHTML='<h2>Listes de courses par semaine</h2>'+[1,2,3,4].map(w=>`<button class="weekbtn" onclick="showWeek(${w})">Semaine ${w} ›</button>`).join('');}
function key(w,c,i){return `pr_w${w}_${c}_${i}`;}
function showWeek(w){let html=`<button class="back" onclick="showWeeks()">← Retour aux semaines</button><h2>Courses — Semaine ${w}</h2><div class="small">${ranges[w-1]}</div>`;
